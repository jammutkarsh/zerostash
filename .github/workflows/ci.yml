name: Check, test and build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run types
      - run: bun run check
      - run: bun run --filter zerostash-extension check
      - run: bun run test
      - run: bun run build
      - run: bun run ext:build
