name: Release

# Push a tag like v0.2.0 to publish a GitHub release with the extension builds.
# Deploys don't happen here: Cloudflare Workers Builds deploys every push to main (and
# applies database migrations). So bump "version" in package.json on main first; that
# push deploys it, and this tag announces it (servers on older versions see an update notice).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEPLOYED=$(bun -e "console.log((await Bun.file('package.json').json()).version)")
          if [ "$VERSION" != "$DEPLOYED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($DEPLOYED). Bump package.json on main, then tag that commit."
            exit 1
          fi
          # Browser stores only accept dotted numbers, so drop any -beta style suffix there.
          EXT_VERSION="${VERSION%%-*}"
          bun -e "
            const pkg = await Bun.file('extension/package.json').json();
            pkg.version = '$EXT_VERSION';
            await Bun.write('extension/package.json', JSON.stringify(pkg, null, '\t') + '\n');"

      - run: bun run types
      - run: bun run check
      - run: bun run --filter zerostash-extension check
      - run: bun run test

      - run: bun run ext:zip

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            extension/zerostash-chrome.zip extension/zerostash-firefox.xpi \
            --title "Zerostash $GITHUB_REF_NAME" --generate-notes --verify-tag
