<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>Zerostash: free, self-hosted bookmarks on Cloudflare</title>
		<meta name="description" content="Free bookmarks in your own Cloudflare account. No subscription, no server to rent, and your links never sit on anyone else's servers." />
		<meta property="og:title" content="Zerostash: free bookmarks in your own Cloudflare account" />
		<meta property="og:description" content="No subscription, no server to rent, and your links never sit on anyone else's servers." />
		<meta property="og:type" content="website" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="theme-color" content="#f7f7f7" />
		<script>
			// Apply the theme before first paint to avoid a flash; the browser/app bar follows it.
			try {
				const t = localStorage.getItem('theme');
				if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
					document.querySelector('meta[name="theme-color"]').content = '#09090b';
				}
			} catch {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/web/main.ts"></script>
	</body>
</html>
