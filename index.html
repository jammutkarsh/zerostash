<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>Zerostash: free bookmarks in your own Cloudflare account</title>
		<meta name="description" content="Free bookmarks in your own Cloudflare account. No subscription, no server to rent, and your links never sit on anyone else's servers." />
		<!-- Absolute URLs point at the project site on purpose: forks serve the same landing page, so it canonicalises there. -->
		<link rel="canonical" href="https://zerostash.utkarshchourasia.in/" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Zerostash" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://zerostash.utkarshchourasia.in/" />
		<meta property="og:title" content="Zerostash: free bookmarks in your own Cloudflare account" />
		<meta property="og:description" content="No subscription, no server to rent, and your links never sit on anyone else's servers." />
		<meta property="og:image" content="https://zerostash.utkarshchourasia.in/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Zerostash dashboard showing saved bookmarks as cards, next to the headline: Free bookmarks in your own Cloudflare account" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@jammutkarsh" />
		<meta name="twitter:creator" content="@jammutkarsh" />
		<meta name="twitter:title" content="Zerostash: free bookmarks in your own Cloudflare account" />
		<meta name="twitter:description" content="No subscription, no server to rent, and your links never sit on anyone else's servers." />
		<meta name="twitter:image" content="https://zerostash.utkarshchourasia.in/og-image.png" />
		<meta name="twitter:image:alt" content="Zerostash dashboard showing saved bookmarks as cards, next to the headline: Free bookmarks in your own Cloudflare account" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareApplication",
				"name": "Zerostash",
				"url": "https://zerostash.utkarshchourasia.in/",
				"description": "Free bookmarks in your own Cloudflare account. No subscription, no server to rent, and your links never sit on anyone else's servers.",
				"applicationCategory": "UtilitiesApplication",
				"operatingSystem": "Web, Chrome, Firefox",
				"image": "https://zerostash.utkarshchourasia.in/og-image.png",
				"license": "https://opensource.org/licenses/MIT",
				"codeRepository": "https://github.com/jammutkarsh/zerostash",
				"offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
			}
		</script>
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="theme-color" content="#f7f7f7" />
		<script>
			// Apply the theme before first paint to avoid a flash; the browser/app bar follows it.
			try {
				const t = localStorage.getItem('theme');
				if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
					document.querySelector('meta[name="theme-color"]').content = '#09090b';
				}
			} catch {}
		</script>
	</head>
	<body>
		<!-- For crawlers that don't run JavaScript; visually hidden and replaced when the app mounts. -->
		<div id="app">
			<div style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">
				<h1>Free bookmarks in your own Cloudflare account</h1>
				<p>No subscription, no server to rent, and your links never sit on anyone else's servers.</p>
			</div>
		</div>
		<script type="module" src="/web/main.ts"></script>
	</body>
</html>
