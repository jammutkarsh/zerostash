<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>Zerostash: free, self-hosted bookmarks on Cloudflare</title>
		<meta name="description" content="Karakeep-style bookmark manager that runs on Cloudflare's free tier: a Worker, a D1 database and a Chrome/Firefox extension. No VPS, no monthly bill." />
		<meta property="og:title" content="Zerostash: bookmarks on your own Cloudflare, for ₹0" />
		<meta property="og:description" content="Karakeep-style bookmarks on Cloudflare's free tier. Deploy in one click, save from your browser." />
		<meta property="og:type" content="website" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<script>
			// Apply the theme before first paint to avoid a flash.
			try {
				const t = localStorage.getItem('theme');
				if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
			} catch {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/web/main.ts"></script>
	</body>
</html>
